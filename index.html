<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FiveClover - Find Hotels in Abuja</title>
<style>body{font-family:sans-serif;margin:0;background:#fff}.hero{padding:40px;text-align:center;background:#ff5a5f;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:20px}.card{border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #ddd}.card img{width:100%;height:200px;object-fit:cover}.card-body{padding:12px}.price{font-weight:bold;color:#ff5a5f}</style>
</head>
<body>
<div class="hero"><h1>FiveClover</h1><p>Hotels in Abuja - Live Updates</p><p id="count">Loading hotels...</p></div>
<div class="grid" id="hotels"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyDzVRHwXgZXZmlX7KIehTLb1n-ZjGJwWfI",
  authDomain: "fiveclover-237bb.firebaseapp.com",
  databaseURL: "https://fiveclover-237bb-default-rtdb.firebaseio.com",
  projectId: "fiveclover-237bb",
  storageBucket: "fiveclover-237bb.firebasestorage.app",
  messagingSenderId: "337287455721",
  appId: "1:337287455721:web:ebbb8fd23959b1b0922178"
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
onValue(ref(db,'hotels'),snap=>{
  const data=snap.val(); const grid=document.getElementById('hotels');
  const count=document.getElementById('count');
  if(!data){grid.innerHTML='<p style="text-align:center">No hotels yet. Check back soon!</p>';count.innerText='0 Hotels';return;}
  const hotels=Object.values(data);
  count.innerText=`${hotels.length} Hotels Available - Live!`;
  grid.innerHTML='';
  hotels.reverse().forEach(h=>{
    grid.innerHTML+=`<div class="card"><img src="${h.image}"><div class="card-body"><h3>${h.name}</h3><p>${h.location}</p><p>${h.desc||''}</p><p class="price">₦${h.price} / night</p><a href="https://wa.me/234XXXXXXXXX?text=Hi, I want to book ${h.name}" style="background:#25D366;color:white;padding:8px 12px;border-radius:6px;text-decoration:none;display:inline-block">Book on WhatsApp</a></div></div>`;
  });
});
</script>
</body>
</html>
