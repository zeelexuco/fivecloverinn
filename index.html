<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiveClover Inn - Book Hotels in Nigeria</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
<div class="bg-green-700 text-white p-4 sticky top-0 z-10">
<div class="max-w-3xl mx-auto flex justify-between items-center">
<h1 class="text-xl font-bold">FiveClover Inn 🍀</h1>
<a href="admin.html" class="text-xs bg-white text-green-700 px-3 py-1 rounded-full">Admin</a>
</div>
</div>
<div class="max-w-3xl mx-auto p-4">
<div id="hotelsContainer" class="space-y-6"></div>
</div>
<div id="bookingModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-20">
<div class="bg-white rounded-2xl p-5 w-full max-w-md">
<h2 class="font-bold text-lg mb-3">Book <span id="modalRoomType"></span></h2>
<input id="guestName" placeholder="Your Full Name" class="w-full border rounded-xl p-3 mb-3">
<input id="guestPhone" placeholder="Phone Number" class="w-full border rounded-xl p-3 mb-3">
<input id="checkIn" type="date" class="w-full border rounded-xl p-3 mb-3">
<input id="checkOut" type="date" class="w-full border rounded-xl p-3 mb-3">
<button id="confirmBookBtn" class="w-full bg-green-600 text-white rounded-xl p-3 font-bold">Confirm Booking</button>
<button onclick="closeModal()" class="w-full mt-2 text-sm text-gray-500">Cancel</button>
<p id="bookingStatus" class="text-sm mt-2 text-center"></p>
</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDzVRHwXgZXZmlX7KIehTLb1n-ZjGJwWfI",
  authDomain: "fiveclover-237bb.firebaseapp.com",
  databaseURL: "https://fiveclover-237bb-default-rtdb.firebaseio.com",
  projectId: "fiveclover-237bb",
  storageBucket: "fiveclover-237bb.firebasestorage.app",
  messagingSenderId: "337287455721",
  appId: "1:337287455721:web:ebbb8fd23959b1b0922178",
  measurementId: "G-G2EG4G3YLZ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let currentHotel = null; let currentRoom = null;
db.collection('hotels').orderBy('createdAt','desc').onSnapshot(snap=>{
  const container = document.getElementById('hotelsContainer');
  container.innerHTML = snap.empty ? '<p class="text-center text-gray-400 mt-10">No hotels yet. Add in admin.</p>' : '';
  snap.forEach(doc=>{
    const hotel = doc.data(); const hotelId = doc.id;
    const div = document.createElement('div'); div.className = 'bg-white rounded-2xl shadow overflow-hidden';
    div.innerHTML = `<img src="${hotel.imageUrl || 'https://via.placeholder.com/600x300?text=FiveClover+Inn'}" class="w-full h-56 object-cover"><div class="p-4"><h2 class="text-xl font-bold">${hotel.name}</h2><p class="text-sm text-gray-500">${hotel.address}</p><p class="text-sm text-green-600 mt-1">${hotel.whatsapp || ''}</p><div id="rooms-${hotelId}" class="mt-4 space-y-3"></div><div class="mt-6 border-t pt-4"><h3 class="font-bold">Customer Reviews <span id="reviewCount-${hotelId}" class="text-green-600 text-sm">(0)</span></h3><div id="reviews-${hotelId}" class="mt-3 space-y-2 max-h-60 overflow-y-auto"></div><div class="bg-gray-50 rounded-xl p-3 mt-3"><p class="text-sm font-bold mb-2">Write your review (for customers wey lodge here)</p><input id="reviewName-${hotelId}" placeholder="Your Name" class="w-full border rounded-xl p-2 text-sm mb-2"><select id="reviewStars-${hotelId}" class="w-full border rounded-xl p-2 text-sm mb-2"><option value="5">⭐⭐⭐⭐⭐ 5 Stars</option><option value="4">⭐⭐⭐⭐ 4 Stars</option><option value="3">⭐⭐⭐ 3 Stars</option><option value="2">⭐⭐ 2 Stars</option><option value="1">⭐ 1 Star</option></select><textarea id="reviewText-${hotelId}" placeholder="How was your stay?" class="w-full border rounded-xl p-2 text-sm mb-2" rows="3"></textarea><button onclick="submitReview('${hotelId}')" class="w-full bg-slate-800 text-white rounded-xl p-2 text-sm font-bold">Submit Review</button><p id="reviewStatus-${hotelId}" class="text-xs mt-1"></p></div></div></div>`;
    container.appendChild(div); loadRooms(hotelId); loadReviews(hotelId);
  });
});
function loadRooms(hotelId){
  db.collection('hotels').doc(hotelId).collection('rooms').onSnapshot(snap=>{
    const cont = document.getElementById(`rooms-${hotelId}`); if(!cont) return;
    cont.innerHTML = snap.empty ? '<p class="text-xs text-gray-400">No rooms yet</p>' : '<p class="font-bold text-sm mb-2">Available Rooms:</p>';
    snap.forEach(rDoc=>{
      const r=rDoc.data(); const available=(r.totalRooms||0)-(r.bookedRooms||0); const isFull=available<=0;
      const el=document.createElement('div'); el.className=`border rounded-xl p-3 flex justify-between items-center ${isFull?'bg-red-50 opacity-60':'bg-green-50'}`;
      el.innerHTML=`<div class="flex gap-3 items-center">${r.imageUrl?`<img src="${r.imageUrl}" class="w-16 h-16 rounded-xl object-cover">`:''}<div><div class="font-bold text-sm">${r.type} - ₦${r.price?.toLocaleString()}</div><div class="text-xs">Total: ${r.totalRooms} | <span class="${isFull?'text-red-600':'text-green-600'} font-bold">${isFull?'FULLY BOOKED':available+' Available'}</span></div></div></div><button ${isFull?'disabled':`onclick="openBooking('${hotelId}','${rDoc.id}','${r.type}','${rDoc.id}')"`} class="bg-green-600 text-white px-4 py-2 rounded-full text-xs font-bold ${isFull?'bg-gray-400':''}">${isFull?'Full':'Book Now'}</button>`;
      cont.appendChild(el);
    });
  });
}
function loadReviews(hotelId){
  db.collection('hotels').doc(hotelId).collection('reviews').orderBy('createdAt','desc').onSnapshot(snap=>{
    document.getElementById(`reviewCount-${hotelId}`).textContent=`(${snap.size})`;
    const cont=document.getElementById(`reviews-${hotelId}`); if(!cont) return; cont.innerHTML=snap.empty?'<p class="text-xs text-gray-400">No reviews yet. Be first!</p>':'';
    snap.forEach(doc=>{const rev=doc.data(); const stars='⭐'.repeat(rev.stars||5); const el=document.createElement('div'); el.className='bg-white border rounded-xl p-2 text-sm'; el.innerHTML=`<div class="flex justify-between"><b>${rev.name}</b><span class="text-xs">${stars}</span></div><div class="text-xs text-gray-600 mt-1">${rev.text}</div>`; cont.appendChild(el);});
  });
}
async function submitReview(hotelId){
  const name=document.getElementById(`reviewName-${hotelId}`).value.trim(); const stars=parseInt(document.getElementById(`reviewStars-${hotelId}`).value); const text=document.getElementById(`reviewText-${hotelId}`).value.trim(); const status=document.getElementById(`reviewStatus-${hotelId}`);
  if(!name||!text){alert('Fill name and review'); return;} status.textContent='Posting...';
  try{await db.collection('hotels').doc(hotelId).collection('reviews').add({name,stars,text,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); status.textContent='Review posted! ✅'; document.getElementById(`reviewName-${hotelId}`).value=''; document.getElementById(`reviewText-${hotelId}`).value='';}catch(e){status.textContent='Error: '+e.message;}
}
function openBooking(hotelId,roomId,roomType,roomDocId){db.collection('hotels').doc(hotelId).get().then(doc=>{currentHotel={id:hotelId,name:doc.data().name}; currentRoom={id:roomDocId,type:roomType,hotelId}; document.getElementById('modalRoomType').textContent=doc.data().name+' - '+roomType; document.getElementById('bookingModal').classList.remove('hidden'); document.getElementById('bookingModal').classList.add('flex');});}
function closeModal(){document.getElementById('bookingModal').classList.add('hidden'); document.getElementById('bookingModal').classList.remove('flex');}
document.getElementById('confirmBookBtn').onclick=async()=>{const guestName=document.getElementById('guestName').value.trim(); const guestPhone=document.getElementById('guestPhone').value.trim(); const checkIn=document.getElementById('checkIn').value; const checkOut=document.getElementById('checkOut').value; const status=document.getElementById('bookingStatus'); if(!guestName||!guestPhone||!checkIn){alert('Fill name, phone, check-in'); return;} status.textContent='Booking...'; try{await db.collection('bookings').add({hotelId:currentHotel.id,hotelName:currentHotel.name,roomId:currentRoom.id,roomType:currentRoom.type,guestName,guestPhone,name:guestName,checkIn,checkOut,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()}); status.textContent='Booked! Admin will confirm ✅'; setTimeout(()=>{closeModal(); status.textContent='';},2000);}catch(e){status.textContent='Error: '+e.message;}};
</script>
</body>
</html>
