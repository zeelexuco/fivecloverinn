<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FiveClover - Hotels</title>
<style>body{font-family:sans-serif;margin:0;background:#fff}.hero{padding:30px;text-align:center;background:#ff5a5f;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:20px}.card{border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #ddd;cursor:pointer}.card img{width:100%;height:200px;object-fit:cover}.card-body{padding:12px}#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;overflow-y:auto;z-index:99}.modalBox{background:white;max-width:650px;margin:20px auto;border-radius:12px;overflow:hidden}.modalBox img.main{width:100%;height:300px;object-fit:cover}.pad{padding:20px}.room{border:1px solid #eee;border-radius:10px;overflow:hidden;margin:12px 0}.room img{width:100%;height:180px;object-fit:cover}.room-info{padding:12px;display:flex;justify-content:space-between;align-items:center}</style>
</head>
<body>
<div class="hero"><h1>FiveClover</h1><p>Tap hotel to see room pictures</p><p id="count">Loading...</p></div>
<div class="grid" id="hotels"></div>
<div id="modal" onclick="if(event.target==this)closeModal()"><div class="modalBox"><img id="mImg" class="main"><div class="pad"><h2 id="mName"></h2><p id="mLoc"></p><p id="mDesc"></p><h3>Available Rooms</h3><div id="mRooms"></div><button onclick="closeModal()" style="background:black;color:white;padding:12px;border:none;border-radius:8px;width:100%">Close</button></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDzVRHwXgZXZmlX7KIehTLb1n-ZjGJwWfI", authDomain: "fiveclover-237bb.firebaseapp.com", databaseURL: "https://fiveclover-237bb-default-rtdb.firebaseio.com", projectId: "fiveclover-237bb", storageBucket: "fiveclover-237bb.firebasestorage.app", messagingSenderId: "337287455721", appId: "1:337287455721:web:ebbb8fd23959b1b0922178" };
const app=initializeApp(firebaseConfig); const db=getDatabase(app); let allHotels=[];
onValue(ref(db,'hotels'),snap=>{
  const data=snap.val(); const grid=document.getElementById('hotels'); const count=document.getElementById('count');
  if(!data){grid.innerHTML='No hotels';count.innerText='0 Hotels';return;}
  allHotels=Object.entries(data).map(([id,h])=>({...h,id}));
  count.innerText=`${allHotels.length} Hotels Live`; grid.innerHTML='';
  allHotels.reverse().forEach(h=>{ grid.innerHTML+=`<div class="card" onclick="openHotel('${h.id}')"><img src="${h.image}"><div class="card-body"><h3>${h.name}</h3><p>${h.location}</p><p>${(h.rooms||[]).length} categories with pics</p></div></div>`; });
});
window.openHotel=(id)=>{
  const h=allHotels.find(x=>x.id==id);
  document.getElementById('mImg').src=h.image; document.getElementById('mName').innerText=h.name; document.getElementById('mLoc').innerText=h.location; document.getElementById('mDesc').innerText=h.desc||'';
  let cleanPhone=h.phone.replace(/[^0-9]/g,'').replace(/^0/,'234'); if(!cleanPhone.startsWith('234')) cleanPhone='234'+cleanPhone.slice(-10);
  let html=''; (h.rooms||[]).forEach(r=>{
    let msg=encodeURIComponent(`Hello ${h.name}, I want to book ${r.type} - ₦${r.price}. Is it available?`);
    html+=`<div class="room"><img src="${r.image||h.image}"><div class="room-info"><div><b>${r.type}</b><br>₦${r.price}/night - ${r.available} left<br><small>${r.desc||''}</small></div><a href="https://wa.me/${cleanPhone}?text=${msg}" target="_blank" style="background:#25D366;color:white;padding:10px 16px;border-radius:6px;text-decoration:none;font-weight:bold">Book</a></div></div>`;
  });
  document.getElementById('mRooms').innerHTML=html; document.getElementById('modal').style.display='block';
};
window.closeModal=()=>document.getElementById('modal').style.display='none';
</script>
</body>
</html>
