<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - FiveClover</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#f1f5f9;margin:0;padding:20px}.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:16px}input,select,button{padding:12px;border-radius:8px;border:1px solid #cbd5e1;width:100%;margin:8px 0}button{background:#0f172a;color:#fff;font-weight:600;cursor:pointer}button.green{background:#16a34a}button.red{background:#dc2626}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;font-size:13px;text-align:left}</style></head><body>
<div id="loginBox" class="card" style="max-width:400px;margin:80px auto"><h2>Admin Login</h2><p style="color:#64748b;font-size:13px">Enter admin password to continue</p><input type="password" id="pwd" placeholder="••••••••"><button onclick="login()">Login</button></div>
<div id="adminBox" style="display:none;max-width:1000px;margin:0 auto"><h1>Super Admin V2.5 Secure</h1>
<div class="card"><h3>Add New Hotel</h3><input id="hotelName" placeholder="Hotel Name"><input id="hotelLoc" placeholder="Location"><button class="green" onclick="addHotel()">Add Hotel</button></div>
<div class="card"><h3>Add Room + Price + Total Rooms</h3><select id="hotelSelect"></select><input id="roomType" placeholder="Room Type e.g Standard"><input id="roomPrice" type="number" placeholder="Price e.g 15000"><input id="roomTotal" type="number" placeholder="Total Rooms e.g 5"><button class="green" onclick="addRoom()">Add Room</button></div>
<div class="card"><h3>Hotels & Rooms</h3><div id="hotelsList"></div></div>
<div class="card"><h3>Bookings - 5→4→5 Logic (12PM)</h3><table><thead><tr><th>Hotel/Room</th><th>Dates (12PM)</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="bookingsTable"></tbody></table></div>
<div class="card"><a href="index.html"><button>View Site</button></a> <button class="red" onclick="if(confirm('Reset all?')){localStorage.clear();location.reload()}">Reset All</button></div></div>
<script>
const PWD='clover12345678'; // <-- CHANGE THIS TO YOUR OWN PASSWORD, e.g 'MySecret123'
function login(){if(document.getElementById('pwd').value===PWD){loginBox.style.display='none';adminBox.style.display='block';load()}else alert('Wrong password')}
function getHotels(){return JSON.parse(localStorage.getItem('fiveclover_hotels')||'[]')}function saveHotels(h){localStorage.setItem('fiveclover_hotels',JSON.stringify(h))}
function getBookings(){return JSON.parse(localStorage.getItem('fiveclover_bookings')||'[]')}function saveBookings(b){localStorage.setItem('fiveclover_bookings',JSON.stringify(b))}
function addHotel(){let n=hotelName.value.trim(),l=hotelLoc.value.trim();if(!n)return alert('Name needed');let h=getHotels();h.push({id:'h'+Date.now(),name:n,location:l,rooms:[]});saveHotels(h);hotelName.value='';hotelLoc.value='';load()}
function addRoom(){let hid=hotelSelect.value,t=roomType.value,p=parseInt(roomPrice.value),tot=parseInt(roomTotal.value);if(!hid||!t||!p||!tot)return alert('Fill all');let hs=getHotels();let ho=hs.find(x=>x.id===hid);ho.rooms.push({id:'r'+Date.now(),type:t,price:p,total:tot});saveHotels(hs);roomType.value='';roomPrice.value='';roomTotal.value='';load()}
function load(){let hs=getHotels();hotelSelect.innerHTML='';hs.forEach(h=>{let o=document.createElement('option');o.value=h.id;o.textContent=h.name;hotelSelect.appendChild(o)});hotelsList.innerHTML='';hs.forEach(h=>{let d=document.createElement('div');d.style.border='1px solid #eee';d.style.padding='8px';d.style.marginBottom='6px';d.innerHTML=`<b>${h.name}</b> - ${h.location} <button style="width:auto" onclick="let a=getHotels().filter(x=>x.id!=='${h.id}');saveHotels(a);load()">Delete</button><ul>${h.rooms.map(r=>`<li>${r.type} - ₦${r.price} - Total:${r.total} <button style="width:auto" onclick="let hs=getHotels();let ho=hs.find(x=>x.id==='${h.id}');ho.rooms=ho.rooms.filter(x=>x.id!=='${r.id}');saveHotels(hs);load()">X</button></li>`).join('')}</ul>`;hotelsList.appendChild(d)});let bs=getBookings();bookingsTable.innerHTML='';bs.slice().reverse().forEach(b=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${b.hotelName}<br><small>${b.roomType}</small></td><td>${b.checkinDate} 12PM to ${b.checkoutDate} 12PM (${b.nights}n)</td><td>₦${b.total}</td><td>${b.status}</td><td>${b.status==='pending'?`<button class="green" style="width:auto" onclick="let bs=getBookings();bs.find(x=>x.id==='${b.id}').status='confirmed';saveBookings(bs);load();alert('Confirmed! 5->4, auto-return at 12PM checkout')">Confirm</button>`:`<small>Return at ${b.checkoutDate} 12PM</small>`} <button style="width:auto" onclick="let bs=getBookings().filter(x=>x.id!=='${b.id}');saveBookings(bs);load()">Delete</button></td>`;bookingsTable.appendChild(tr)});}
</script></body></html>
