<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FiveClover Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;font-family:'Outfit',system-ui}body{margin:0;background:#f1f5f9;padding:0 12px 50px}header{background:#0f172a;color:#fff;padding:16px;border-radius:0 0 18px 18px}header h1{margin:0;font-size:20px}a{color:#86efac;text-decoration:none}.card{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.06);border:1px solid #e2e8f0}input{width:100%;padding:12px;border-radius:10px;border:1.5px solid #e2e8f0;margin:6px 0}button{padding:10px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer}.btn-green{background:#16a34a;color:#fff;width:100%;padding:14px;margin-top:8px}.btn-dark{background:#0f172a;color:#fff}.btn-red{background:#ef4444;color:#fff;font-size:12px;padding:6px 10px}.hotelBox{border:1.5px solid #e2e8f0;border-radius:14px;padding:12px;margin:10px 0;background:#fff}.roomLine{display:flex;justify-content:space-between;background:#f8fafc;padding:8px 10px;border-radius:8px;margin:4px 0;font-size:14px}#status{text-align:center;padding:8px;font-weight:700;font-size:13px;margin:8px 0;border-radius:10px}</style></head><body>
<header><h1>☘️ FiveClover Admin</h1><small>Step 1: Add Hotel → Step 2: Add Rooms under hotel</small><br><a href="https://zeelexuco.github.io" target="_blank">→ Customer Site</a></header>
<div id="status" style="background:#fff">Connecting...</div>

<div class="card">
<h3 style="margin:0 0 6px">1. Add New Hotel</h3>
<input id="hName" placeholder="Hotel Name e.g. Caritas INN IGBOBI">
<input id="hLoc" placeholder="Full Address e.g. WAEC Bus Stop, Igbobi...">
<input id="hWha" placeholder="WhatsApp e.g. 08126955544">
<input type="file" id="hImg" accept="image/*"><div id="preview"></div>
<button class="btn-green" onclick="saveHotel()">Save Hotel</button>
</div>

<div class="card">
<h3 style="margin:0">Hotels Live - <span id="count">0</span></h3>
<div id="hotelsList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey:"AIzaSyDzVRHwXgZXZmlX7KIehTLb1n-ZjGJwWfI", authDomain:"fiveclover-237bb.firebaseapp.com", projectId:"fiveclover-237bb", storageBucket:"fiveclover-237bb.firebasestorage.app", messagingSenderId:"337287455721", appId:"1:337287455721:web:ebbb8fd23959b1b0922178" };
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
let imgBase64=""; const status=document.getElementById('status');
document.getElementById('hImg').addEventListener('change', e=>{ let r=new FileReader(); r.onload=ev=>{ imgBase64=ev.target.result; document.getElementById('preview').innerHTML=`<img src="${imgBase64}" style="width:100%;height:160px;object-fit:cover;border-radius:10px;margin-top:6px">`; }; r.readAsDataURL(e.target.files[0]); });

window.saveHotel=async()=>{
  let name=document.getElementById('hName').value.trim(), loc=document.getElementById('hLoc').value.trim(), wha=document.getElementById('hWha').value.trim();
  if(!name||!loc) return alert('Fill hotel name and location');
  status.textContent='Saving hotel...';
  try{ await addDoc(collection(db,"hotels"),{name,location:loc.toUpperCase(),whatsapp:wha,image:imgBase64,rooms:[],createdAt:Date.now()}); status.textContent='Hotel saved! Now add rooms under it below ✅'; document.getElementById('hName').value=''; document.getElementById('hLoc').value=''; document.getElementById('preview').innerHTML=''; }
  catch(e){ status.textContent='ERROR: '+e.message; }
};

window.addRoomToHotel=async(id)=>{
  let type=document.getElementById('type-'+id).value.trim(), price=document.getElementById('price-'+id).value;
  if(!type||!price) return alert('Fill room type and price');
  let room={type:type.toUpperCase(),price:Number(price),total:10};
  await updateDoc(doc(db,"hotels",id),{rooms:arrayUnion(room)});
  document.getElementById('type-'+id).value=''; document.getElementById('price-'+id).value='';
};

window.deleteRoom=async(hotelId, roomIndex)=>{
  if(!confirm('Delete this room?')) return;
  let hotelDoc = hotelsCache.find(h=>h.id===hotelId);
  let newRooms = hotelDoc.rooms.filter((_,i)=>i!==roomIndex);
  await updateDoc(doc(db,"hotels",hotelId),{rooms:newRooms});
};

window.delHotel=async(id)=>{ if(confirm('Delete hotel?')) await deleteDoc(doc(db,"hotels",id)); };

let hotelsCache=[];
onSnapshot(collection(db,"hotels"), s=>{
  hotelsCache=[]; let html='';
  s.forEach(d=>{ let h={id:d.id,...d.data()}; hotelsCache.push(h);
    html+=`<div class="hotelBox">
      <b>${h.name}</b> - ${h.location} - WhatsApp: ${h.whatsapp} <button class="btn-red" onclick="delHotel('${h.id}')">Delete</button>
      <div style="margin:8px 0 6px">
        ${(h.rooms||[]).map((r,i)=>`<div class="roomLine"><span>• ${r.type} - ₦${r.price}</span><span onclick="deleteRoom('${h.id}',${i})" style="color:red;cursor:pointer">✕</span></div>`).join('') || '<small style="opacity:.5">No rooms yet - add below</small>'}
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <input id="type-${h.id}" placeholder="STANDARD" style="flex:1">
        <input id="price-${h.id}" type="number" placeholder="₦43900" style="flex:1">
        <button class="btn-dark" onclick="addRoomToHotel('${h.id}')">Add</button>
      </div>
    </div>`;
  });
  document.getElementById('hotelsList').innerHTML=html||'No hotels';
  document.getElementById('count').textContent=s.size;
  status.textContent=`Cloud connected - ${s.size} hotel(s) live`;
});
</script></body></html>
