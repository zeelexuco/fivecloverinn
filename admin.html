<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FiveClover Admin V2.2 - Room Pics</title>
<style>body{font-family:sans-serif;padding:20px;max-width:700px;margin:auto;background:#f5f5f5}input,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{background:#ff5a5f;color:white;font-weight:bold;border:none;cursor:pointer}.roomBox{background:white;padding:12px;border-radius:8px;margin:12px 0;border-left:5px solid #ff5a5f}label{font-size:11px;font-weight:bold;color:#555}img{max-width:100%;border-radius:8px}</style>
</head>
<body>
<h2>FiveClover Admin V2.2 - Room Pictures</h2>
<input id="name" placeholder="Hotel Name"><input id="location" placeholder="Location"><input id="whatsapp" placeholder="Hotel WhatsApp"><textarea id="desc" placeholder="Hotel Description"></textarea>
<label>Main Hotel Picture *</label><input id="image" type="file" accept="image/*"><img id="preview" style="display:none">

<h3>Room Categories (with picture)</h3>
<div id="rooms"></div>
<button onclick="addRoom()" style="background:black">+ Add Another Room Category</button>
<button onclick="upload()" style="margin-top:20px;padding:16px;font-size:18px">UPLOAD HOTEL + ROOMS</button>
<p id="status"></p><div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDzVRHwXgZXZmlX7KIehTLb1n-ZjGJwWfI", authDomain: "fiveclover-237bb.firebaseapp.com", databaseURL: "https://fiveclover-237bb-default-rtdb.firebaseio.com", projectId: "fiveclover-237bb", storageBucket: "fiveclover-237bb.firebasestorage.app", messagingSenderId: "337287455721", appId: "1:337287455721:web:ebbb8fd23959b1b0922178" };
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let base64Image=""; let roomCount=0; let roomImages={};
document.getElementById('image').addEventListener('change', e=>{ const r=new FileReader(); r.onload=ev=>{base64Image=ev.target.result; document.getElementById('preview').src=base64Image; document.getElementById('preview').style.display='block';}; r.readAsDataURL(e.target.files[0]); });

window.addRoom=()=>{
  roomCount++;
  document.getElementById('rooms').innerHTML+=`<div class="roomBox" id="room${roomCount}">
  <b>Room ${roomCount}</b>
  <label>Category Name *</label><input id="rname${roomCount}" placeholder="Standard">
  <label>Price * (no comma)</label><input id="rprice${roomCount}" placeholder="25000">
  <label>Available</label><input id="ravailable${roomCount}" value="5">
  <label>Features</label><input id="rdesc${roomCount}" placeholder="WiFi, AC">
  <label>Room Picture (show customer how e be) *</label><input type="file" accept="image/*" onchange="handleRoomImg(event, ${roomCount})"><img id="rpreview${roomCount}" style="display:none;margin-top:6px;height:120px;object-fit:cover">
  <button onclick="document.getElementById('room${roomCount}').remove()" style="background:#333;margin-top:8px">Remove</button></div>`;
};
window.handleRoomImg=(e,id)=>{
  const file=e.target.files[0]; const reader=new FileReader();
  reader.onload=ev=>{roomImages[id]=ev.target.result; document.getElementById('rpreview'+id).src=ev.target.result; document.getElementById('rpreview'+id).style.display='block';};
  reader.readAsDataURL(file);
};
addRoom();
window.upload=()=>{
  const name=document.getElementById('name').value.trim(); const loc=document.getElementById('location').value.trim(); const whatsapp=document.getElementById('whatsapp').value.trim(); const desc=document.getElementById('desc').value.trim();
  if(!name||!whatsapp||!base64Image){alert('Add name, WhatsApp, main picture');return;}
  let rooms=[];
  document.querySelectorAll('.roomBox').forEach(box=>{
    const id=box.id.replace('room','');
    let rname=document.getElementById('rname'+id)?.value.trim();
    let rprice=document.getElementById('rprice'+id)?.value.trim().replace(/,/g,'');
    let rav=document.getElementById('ravailable'+id)?.value.trim()||'1';
    let rd=document.getElementById('rdesc'+id)?.value.trim();
    let rimg=roomImages[id]||'';
    if(rname && rprice && rimg){ rooms.push({type:rname, price:rprice, available:rav, desc:rd, image:rimg}); }
  });
  if(rooms.length==0){alert('Add at least 1 room with NAME, PRICE and ROOM PICTURE!');return;}
  document.getElementById('status').innerText='Uploading...';
  push(ref(db,'hotels'),{name,location:loc,phone:whatsapp,whatsapp,desc,image:base64Image,rooms,createdAt:Date.now()}).then(()=>{document.getElementById('status').innerText='✅ Done!'; document.getElementById('rooms').innerHTML=''; roomCount=0; roomImages={}; addRoom();});
};
onValue(ref(db,'hotels'),snap=>{ const data=snap.val(); const list=document.getElementById('list'); list.innerHTML='<h3>Hotels</h3>'; if(!data)return; Object.entries(data).reverse().forEach(([k,h])=>{ list.innerHTML+=`<div style="background:white;padding:10px;margin:10px 0;border-radius:8px"><img src="${h.image}"><b>${h.name}</b><br>${(h.rooms||[]).length} rooms<br><button onclick="deleteHotel('${k}')" style="background:black">Delete</button></div>`; }); });
window.deleteHotel=(k)=>{ if(confirm('Delete?')) remove(ref(db,'hotels/'+k)); };
</script>
</body>
</html>
