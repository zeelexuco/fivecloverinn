<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FiveClover Admin - Upload Hotel</title>
<style>body{font-family:sans-serif;padding:20px;max-width:600px;margin:auto;background:#f5f5f5}input,textarea,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}button{background:#ff5a5f;color:white;font-weight:bold;border:none;cursor:pointer}img{max-width:100%;border-radius:8px}</style>
</head>
<body>
<h2>FiveClover Admin - Add Hotel</h2>
<input id="name" placeholder="Hotel Name e.g Grand Abuja">
<input id="location" placeholder="Location e.g Wuse, Abuja">
<input id="price" type="number" placeholder="Price per night e.g 25000">
<textarea id="desc" placeholder="Description"></textarea>
<input id="image" type="file" accept="image/*">
<img id="preview" style="display:none">
<button onclick="upload()">UPLOAD TO CLOUD - Customers Will See Live!</button>
<p id="status"></p>
<h3>Uploaded Hotels</h3><div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzVRHwXgZXZmlX7KIehTLb1n-ZjGJwWfI",
  authDomain: "fiveclover-237bb.firebaseapp.com",
  databaseURL: "https://fiveclover-237bb-default-rtdb.firebaseio.com",
  projectId: "fiveclover-237bb",
  storageBucket: "fiveclover-237bb.firebasestorage.app",
  messagingSenderId: "337287455721",
  appId: "1:337287455721:web:ebbb8fd23959b1b0922178"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let base64Image = "";
document.getElementById('image').addEventListener('change', e=>{
  const file=e.target.files[0];
  const reader=new FileReader();
  reader.onload=ev=>{
    base64Image=ev.target.result;
    document.getElementById('preview').src=base64Image;
    document.getElementById('preview').style.display='block';
  };
  reader.readAsDataURL(file);
});

window.upload = ()=>{
  const name=document.getElementById('name').value;
  const loc=document.getElementById('location').value;
  const price=document.getElementById('price').value;
  const desc=document.getElementById('desc').value;
  if(!name||!price||!base64Image){alert('Add name, price and picture!');return;}
  document.getElementById('status').innerText='Uploading...';
  push(ref(db,'hotels'),{name,location:loc,price,desc,image:base64Image,createdAt:Date.now()})
 .then(()=>{document.getElementById('status').innerText='✅ Uploaded! Customers now see it LIVE!'; document.getElementById('name').value='';document.getElementById('price').value='';})
 .catch(err=>{document.getElementById('status').innerText='Error: '+err.message});
};

onValue(ref(db,'hotels'),snap=>{
  const data=snap.val(); const list=document.getElementById('list'); list.innerHTML='';
  if(!data){list.innerHTML='No hotels yet';return;}
  Object.entries(data).reverse().forEach(([key,h])=>{
    list.innerHTML+=`<div style="background:white;padding:10px;margin:10px 0;border-radius:8px"><img src="${h.image}"><b>${h.name}</b> - ₦${h.price}<br>${h.location}<br><button onclick="deleteHotel('${key}')" style="background:black">Delete</button></div>`;
  });
});
window.deleteHotel=(k)=>{ if(confirm('Delete this hotel?')) remove(ref(db,'hotels/'+k)); };
</script>
</body>
</html>
