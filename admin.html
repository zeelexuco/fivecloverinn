<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Near Me - Host Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

<div id="lockScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-50">
<div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center">
<h1 class="text-2xl font-bold">🔒 Hotel Near Me Admin</h1>
<p class="text-xs text-gray-500 mt-1">Host Management System</p>
<input id="adminPass" type="password" placeholder="Password" class="w-full border-2 rounded-xl p-3 mb-3 mt-4 text-center">
<button onclick="checkPassword()" class="w-full bg-blue-600 text-white rounded-xl p-3 font-bold">Unlock Dashboard</button>
<p id="passError" class="text-xs text-red-500 mt-2"></p>
</div>
</div>

<div id="adminContent" class="hidden p-3">
<div class="max-w-2xl mx-auto">
<div class="bg-blue-100 border-2 border-blue-400 rounded-xl p-3 mb-4 text-sm">
<b>🏨 Hotel Near Me - Host Mode:</b> You are now a Booking.com style platform! Add multiple hotels.
</div>

<div class="bg-white rounded-2xl p-5 shadow mb-5">
<h1 class="text-xl font-bold">1. Add New Host Hotel</h1>
<p class="text-xs text-gray-500">Add hotels from different owners - you earn commission</p>
<input id="hotelName" placeholder="Hotel Name e.g. Lagos Continental Hotel" class="w-full border-2 rounded-xl p-3 mb-3 mt-3">
<input id="hotelAddress" placeholder="Full Address e.g. Ikeja, Lagos" class="w-full border-2 rounded-xl p-3 mb-3">
<input id="hotelWhatsApp" placeholder="Host WhatsApp e.g. 081..." class="w-full border-2 rounded-xl p-3 mb-3">
<label class="w-full border-2 border-dashed rounded-xl p-3 mb-3 flex gap-3 cursor-pointer bg-blue-50">📷 Hotel Main Pic <input type="file" id="hotelImage" hidden accept="image/*"><span id="hotelFileName" class="text-sm">choose file</span></label>
<img id="hotelPreview" class="w-full h-32 object-cover rounded-xl hidden mb-3">
<button id="saveHotelBtn" class="w-full bg-blue-600 text-white rounded-xl p-3 font-bold">Save Hotel Host ✅</button>
</div>

<div class="bg-white rounded-2xl p-5 shadow mb-5">
<h2 class="text-xl font-bold">Hotels Live - <span id="hotelCount">0</span> Hosts</h2>
<div id="hotelsList" class="mt-4"></div>
</div>

<div class="bg-white rounded-2xl p-5 shadow"><h2 class="text-xl font-bold">📋 All Bookings (All Hotels)</h2><div id="bookingsList" class="mt-4 space-y-3"></div></div>
</div>
</div>

<script>
const ADMIN_PASSWORD="hotelnearme2024";
function checkPassword(){
  if(document.getElementById('adminPass').value===ADMIN_PASSWORD){
    document.getElementById('lockScreen').classList.add('hidden');
    document.getElementById('adminContent').classList.remove('hidden');
    localStorage.setItem('hotelnearme_admin','unlocked');
  } else { document.getElementById('passError').textContent='Wrong password! Use: hotelnearme2024'; }
}
if(localStorage.getItem('hotelnearme_admin')==='unlocked'){document.getElementById('lockScreen').classList.add('hidden'); document.getElementById('adminContent').classList.remove('hidden');}

const firebaseConfig={apiKey:"AIzaSyDzVRHwXgZXZmlX7KIehTLb1n-ZjGJwWfI",authDomain:"fiveclover-237bb.firebaseapp.com",projectId:"fiveclover-237bb",messagingSenderId:"337287455721",appId:"1:337287455721:web:ebbb8fd23959b1b0922178"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();

let hotelBase64=''; let roomBase64Map={};
function fileToBase64(file, callback){
  const reader=new FileReader();
  reader.onload=e=>callback(e.target.result);
  reader.readAsDataURL(file);
}
document.getElementById('hotelImage').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  document.getElementById('hotelFileName').textContent=file.name;
  fileToBase64(file, base64=>{
    hotelBase64=base64;
    const prev=document.getElementById('hotelPreview');
    prev.src=base64; prev.classList.remove('hidden');
  });
});
document.getElementById('saveHotelBtn').onclick=async()=>{
  const name=document.getElementById('hotelName').value.trim();
  const address=document.getElementById('hotelAddress').value.trim();
  const whatsapp=document.getElementById('hotelWhatsApp').value.trim();
  if(!name){alert('Fill name');return;}
  if(!hotelBase64){alert('Pick Hotel Pic!');return;}
  try{
    await db.collection('hotels').add({name,address,whatsapp,imageUrl:hotelBase64,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    alert('Hotel Host saved ✅');
    document.getElementById('hotelName').value=''; document.getElementById('hotelAddress').value=''; document.getElementById('hotelWhatsApp').value='';
    hotelBase64=''; document.getElementById('hotelFileName').textContent='choose file'; document.getElementById('hotelPreview').classList.add('hidden');
  }catch(e){alert('Error: '+e.message);}
};

db.collection('hotels').orderBy('createdAt','desc').onSnapshot(snap=>{
  document.getElementById('hotelCount').textContent=snap.size;
  const container=document.getElementById('hotelsList'); container.innerHTML='';
  snap.forEach(doc=>{
    const hotel=doc.data(); const id=doc.id;
    const div=document.createElement('div'); div.className='border-2 rounded-2xl p-4 mb-4 bg-gray-50';
    div.innerHTML=`<div class="font-bold text-sm">${hotel.name} - ${hotel.address}<br>WhatsApp:${hotel.whatsapp} <button onclick="db.collection('hotels').doc('${id}').delete()" class="bg-red-500 text-white px-2 py-1 rounded-full text-xs ml-2">Delete Host</button></div><img src="${hotel.imageUrl}" class="w-full h-32 object-cover rounded-xl mt-2"><div id="rooms-${id}" class="mt-3"></div><div class="bg-white p-3 rounded-xl mt-3 border-2"><p class="font-bold text-sm mb-2">Add Room WITH Pic</p><div class="grid grid-cols-2 gap-2 mb-2"><input id="roomType-${id}" placeholder="STANDARD" class="border rounded-xl p-2 text-sm"><input id="roomPrice-${id}" type="number" placeholder="Price 43900" class="border rounded-xl p-2 text-sm"></div><div class="grid grid-cols-2 gap-2 mb-2"><input id="roomTotal-${id}" type="number" placeholder="Total e.g. 3" class="border rounded-xl p-2 text-sm bg-yellow-50 font-bold"><label class="border-2 border-blue-500 rounded-xl p-2 text-sm bg-blue-50 text-center font-bold cursor-pointer">📷 Room Pic<input type="file" id="roomImage-${id}" hidden accept="image/*"><span id="roomFile-${id}" class="text-[10px] block">must pick</span></label></div><img id="roomPreview-${id}" class="w-full h-24 object-cover rounded-xl hidden mb-2"><button id="btn-${id}" onclick="addRoom('${id}')" class="w-full bg-blue-600 text-white rounded-xl p-3 text-sm font-bold">Add Room ✅</button></div>`;
    container.appendChild(div);
    setTimeout(()=>{
      const inp=document.getElementById(`roomImage-${id}`);
      if(inp) inp.addEventListener('change',e=>{
        const file=e.target.files[0]; if(!file) return;
        document.getElementById(`roomFile-${id}`).textContent=file.name;
        fileToBase64(file, base64=>{
          roomBase64Map[id]=base64;
          const prev=document.getElementById(`roomPreview-${id}`);
          prev.src=base64; prev.classList.remove('hidden');
        });
      });
    },100);
    listenRooms(id);
  });
});
async function addRoom(hotelId){
  const type=document.getElementById(`roomType-${hotelId}`).value.trim();
  const price=parseInt(document.getElementById(`roomPrice-${hotelId}`).value);
  const total=parseInt(document.getElementById(`roomTotal-${hotelId}`).value);
  const imageUrl=roomBase64Map[hotelId];
  if(!type||!price||!total){alert('Fill Type, Price, Total');return;}
  if(!imageUrl){alert('Pick Room Pic!');return;}
  const btn=document.getElementById(`btn-${hotelId}`); btn.textContent='Saving...';
  try{
    await db.collection('hotels').doc(hotelId).collection('rooms').add({type,price,totalRooms:total,bookedRooms:0,availableRooms:total,imageUrl,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    alert('Room added ✅');
    document.getElementById(`roomType-${hotelId}`).value=''; document.getElementById(`roomPrice-${hotelId}`).value=''; document.getElementById(`roomTotal-${hotelId}`).value='';
    roomBase64Map[hotelId]=''; document.getElementById(`roomFile-${hotelId}`).textContent='must pick'; document.getElementById(`roomPreview-${hotelId}`).classList.add('hidden');
  }catch(e){alert('Error: '+e.message);}finally{btn.textContent='Add Room ✅';}
}
function listenRooms(hotelId){
  db.collection('hotels').doc(hotelId).collection('rooms').onSnapshot(snap=>{
    const cont=document.getElementById(`rooms-${hotelId}`); if(!cont) return; cont.innerHTML='';
    snap.forEach(rDoc=>{
      const r=rDoc.data(); const available=(r.totalRooms||0)-(r.bookedRooms||0);
      const el=document.createElement('div'); el.className='flex justify-between border-2 rounded-xl p-2 mt-2 bg-white';
      el.innerHTML=`<div class="flex gap-2 items-center"><img src="${r.imageUrl}" class="w-16 h-16 rounded-xl object-cover"><div class="text-xs"><b>${r.type} - ₦${r.price}</b><br>Total:${r.totalRooms} Avail:${available}</div></div><button onclick="db.collection('hotels').doc('${hotelId}').collection('rooms').doc('${rDoc.id}').delete()" class="text-red-500">✕</button>`;
      cont.appendChild(el);
    });
  });
}

db.collection('bookings').orderBy('createdAt','desc').onSnapshot(snap=>{
  const container = document.getElementById('bookingsList');
  if(snap.empty){
    container.innerHTML = '<p class="text-sm text-gray-400">No bookings yet</p>';
    return;
  }
  container.innerHTML = '';
  snap.forEach(doc=>{
    const b = doc.data();
    const days = b.numDays || 1;
    const total = b.totalPrice? `₦${Number(b.totalPrice).toLocaleString()}` : 'Calculating...';
    const checkIn = b.checkIn || 'N/A';
    const checkOut = b.checkOut || 'N/A';

    const div = document.createElement('div');
    div.className = 'border-2 rounded-xl p-3 bg-yellow-50';
    div.innerHTML = `
      <div class="flex justify-between">
        <b class="text-sm">${b.hotelName} - ${b.roomType}</b>
        <span class="text-xs bg-blue-600 text-white px-2 py-1 rounded-full">${b.status}</span>
      </div>
      <div class="text-xs mt-2 space-y-1">
        <div>👤 <b>${b.guestName || b.name}</b> - ${b.guestPhone}</div>
        <div>📅 <b>${days} day(s)</b> | Check-in: <b>${checkIn}</b></div>
        <div>📅 Check-out: <b>${checkOut}</b></div>
        <div>💰 Total: <b class="text-blue-700 text-sm">${total}</b> | Your Commission (15%): <b>₦${Math.round((b.totalPrice||0)*0.15).toLocaleString()}</b></div>
        <div class="text-[10px] text-gray-500">${b.createdAt?.toDate().toLocaleString() || ''}</div>
      </div>
      <div class="flex gap-2 mt-3">
        <a href="https://wa.me/${(b.guestPhone||'').replace(/[^0-9]/g,'').replace(/^0/,'234')}" target="_blank" class="flex-1 bg-green-600 text-white text-xs text-center py-2 rounded-xl font-bold">Chat Customer</a>
        <button onclick="db.collection('bookings').doc('${doc.id}').update({status:'confirmed'})" class="flex-1 bg-blue-600 text-white text-xs py-2 rounded-xl font-bold">Confirm</button>
        <button onclick="db.collection('bookings').doc('${doc.id}').delete()" class="bg-red-500 text-white text-xs px-3 py-2 rounded-xl">✕</button>
      </div>
    `;
    container.appendChild(div);
  });
});
</script>
</body>
</html>
