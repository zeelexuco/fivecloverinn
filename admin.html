<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin V2.7 Secure</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{background:#f1f5f9;margin:0;padding:16px}.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}input,select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0}button{background:#0f172a;color:#fff;font-weight:700;cursor:pointer}button.green{background:#16a34a}button.red{background:#dc2626}</style>
</head><body>
<div id="loginBox" class="card" style="max-width:380px;margin:70px auto">
<h3>Admin Login</h3>
<input type="password" id="pwd" placeholder="Password">
<button onclick="doLogin()">Login</button>
</div>

<div id="adminBox" style="display:none;max-width:1000px;margin:0 auto">
<h2>☘️ FiveClover Admin V2.7</h2>
<div class="card"><h3>Add Hotel + Picture</h3><input id="hotelName" placeholder="Hotel Name"><input id="hotelLoc" placeholder="Location"><input id="hotelPic" type="file" accept="image/*"><button class="green" onclick="addHotel()">Add Hotel</button></div>
<div class="card"><h3>Add Room (Fix: price can be 43,900)</h3><select id="hotelSelect"></select><input id="roomType" placeholder="Room Type e.g STANDARD"><input id="roomPrice" placeholder="Price e.g 43900 or 43,900"><input id="roomTotal" placeholder="Total Rooms e.g 5"><input id="roomPic" type="file" accept="image/*"><button class="green" onclick="addRoom()">Add Room</button></div>
<div class="card"><h3>Hotels Live</h3><div id="hotelsList"></div></div>
<div class="card"><h3>Bookings</h3><div id="bookingsList"></div></div>
<div class="card"><h3>Reviews</h3><div id="reviewsList"></div></div>
<div class="card"><a href="index.html"><button>View Customer Site</button></a></div>
</div>

<script>
const PWD='clover2025'; // CHANGE TO YOUR OWN PASSWORD HERE e.g 'MyNewPass123!'
function doLogin(){
  let v=document.getElementById('pwd').value;
  if(v===PWD){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminBox').style.display='block';
    load();
  } else {
    alert('Wrong password. Default is clover2025');
  }
}
function getHotels(){return JSON.parse(localStorage.getItem('fiveclover_hotels')||'[]')}
function saveHotels(h){localStorage.setItem('fiveclover_hotels',JSON.stringify(h))}
function getBookings(){return JSON.parse(localStorage.getItem('fiveclover_bookings')||'[]')}
function saveBookings(b){localStorage.setItem('fiveclover_bookings',JSON.stringify(b))}
function getReviews(){return JSON.parse(localStorage.getItem('fiveclover_reviews')||'[]')}
function saveReviews(r){localStorage.setItem('fiveclover_reviews',JSON.stringify(r))}
function fileToBase64(f){return new Promise(res=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(f)})}
async function addHotel(){
  let n=document.getElementById('hotelName').value.trim();
  let l=document.getElementById('hotelLoc').value.trim();
  let file=document.getElementById('hotelPic').files[0];
  if(!n)return alert('Hotel name needed');
  let pic=''; if(file) pic=await fileToBase64(file);
  let hs=getHotels(); hs.push({id:'h'+Date.now(),name:n,location:l,image:pic,rooms:[]});
  saveHotels(hs); document.getElementById('hotelName').value='';document.getElementById('hotelLoc').value='';document.getElementById('hotelPic').value=''; load();
}
async function addRoom(){
  let hid=document.getElementById('hotelSelect').value;
  let t=document.getElementById('roomType').value.trim();
  let pRaw=document.getElementById('roomPrice').value;
  let totRaw=document.getElementById('roomTotal').value;
  let file=document.getElementById('roomPic').files[0];
  let p=parseInt(String(pRaw).replace(/[^0-9]/g,''));
  let tot=parseInt(String(totRaw).replace(/[^0-9]/g,''));
  if(!hid||!t||!p||!tot) return alert('Fill all: Select hotel, type price like 43900, total rooms');
  let pic=''; if(file) pic=await fileToBase64(file);
  let hs=getHotels(); let h=hs.find(x=>x.id===hid);
  h.rooms.push({id:'r'+Date.now(),type:t,price:p,total:tot,image:pic});
  saveHotels(hs);
  document.getElementById('roomType').value='';document.getElementById('roomPrice').value='';document.getElementById('roomTotal').value='';document.getElementById('roomPic').value='';
  load();
}
function load(){
  let hs=getHotels();
  let sel=document.getElementById('hotelSelect'); sel.innerHTML='';
  hs.forEach(h=>{let o=document.createElement('option');o.value=h.id;o.textContent=h.name;sel.appendChild(o)});
  document.getElementById('hotelsList').innerHTML=hs.map(h=>`<div style="border:1px solid #eee;padding:8px;margin-bottom:6px;border-radius:8px"><b>${h.name}</b> - ${h.location} <button class="red" style="width:auto;padding:4px 8px" onclick="saveHotels(getHotels().filter(x=>x.id!=='${h.id}'));load()">Delete</button><ul>${h.rooms.map(r=>`<li>${r.type} - ₦${r.price} - ${r.total} rooms</li>`).join('')}</ul></div>`).join('')||'No hotels yet';
  let bs=getBookings();
  document.getElementById('bookingsList').innerHTML=bs.slice().reverse().map(b=>`<div style="padding:6px;border-bottom:1px solid #eee">${b.hotelName} (${b.roomType}) - ${b.checkinDate}→${b.checkoutDate} - ₦${b.total} - ${b.status} <button style="width:auto" onclick="let a=getBookings();a.find(x=>x.id==='${b.id}').status='confirmed';saveBookings(a);load()">Confirm</button> <button style="width:auto" class="red" onclick="saveBookings(getBookings().filter(x=>x.id!=='${b.id}'));load()">Del</button></div>`).join('')||'No bookings';
  let rs=getReviews();
  document.getElementById('reviewsList').innerHTML=rs.slice().reverse().map(r=>`<div style="padding:6px;border-bottom:1px solid #eee"><b>${r.hotelName}</b> - ${'⭐'.repeat(r.rating)}<br>${r.comment} <button style="width:auto" class="red" onclick="saveReviews(getReviews().filter(x=>x.id!=='${r.id}'));load()">Del</button></div>`).join('')||'No reviews';
}
</script>
</body></html>
