<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FiveClover Admin V2</title>
<style>body{font-family:sans-serif;padding:20px;max-width:700px;margin:auto;background:#f5f5f5}input,textarea,button,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{background:#ff5a5f;color:white;font-weight:bold;border:none;cursor:pointer}.roomBox{background:white;padding:12px;border-radius:8px;margin:8px 0;border-left:4px solid #ff5a5f}img{max-width:100%;border-radius:8px}</style>
</head>
<body>
<h2>FiveClover Admin V2 - Lagos Marketplace</h2>
<h3>Hotel Info</h3>
<input id="name" placeholder="Hotel Name e.g Lekki Grand">
<input id="location" placeholder="Location e.g Lekki Phase 1, Lagos">
<input id="whatsapp" placeholder="Hotel WhatsApp e.g 08012345678 (THIS hotel number)">
<textarea id="desc" placeholder="Hotel Description"></textarea>
<input id="image" type="file" accept="image/*"><img id="preview" style="display:none">

<h3>Room Categories</h3>
<div id="rooms"></div>
<button onclick="addRoom()" style="background:black">+ Add Room Category</button>

<button onclick="upload()" style="margin-top:20px;padding:16px;font-size:18px">UPLOAD HOTEL WITH ROOMS TO CLOUD</button>
<p id="status"></p>
<h3>All Hotels</h3><div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDzVRHwXgZXZmlX7KIehTLb1n-ZjGJwWfI", authDomain: "fiveclover-237bb.firebaseapp.com", databaseURL: "https://fiveclover-237bb-default-rtdb.firebaseio.com", projectId: "fiveclover-237bb", storageBucket: "fiveclover-237bb.firebasestorage.app", messagingSenderId: "337287455721", appId: "1:337287455721:web:ebbb8fd23959b1b0922178" };
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let base64Image=""; let roomCount=0;
document.getElementById('image').addEventListener('change', e=>{ const r=new FileReader(); r.onload=ev=>{base64Image=ev.target.result; document.getElementById('preview').src=base64Image; document.getElementById('preview').style.display='block';}; r.readAsDataURL(e.target.files[0]); });
window.addRoom=()=>{ roomCount++; document.getElementById('rooms').innerHTML+=`<div class="roomBox" id="room${roomCount}"><b>Room ${roomCount}</b><input id="rname${roomCount}" placeholder="Category e.g Standard, Deluxe, Executive Suite"><input id="rprice${roomCount}" type="number" placeholder="Price per night e.g 25000"><input id="ravailable${roomCount}" type="number" placeholder="Rooms Available e.g 5"><input id="rdesc${roomCount}" placeholder="Room features e.g AC, WiFi, Breakfast"><button onclick="document.getElementById('room${roomCount}').remove()" style="background:#333">Remove</button></div>`; };
addRoom();
window.upload=()=>{ const name=document.getElementById('name').value; const loc=document.getElementById('location').value; const whatsapp=document.getElementById('whatsapp').value; const desc=document.getElementById('desc').value; if(!name||!whatsapp||!base64Image){alert('Add hotel name, WhatsApp and picture!');return;} let rooms=[]; document.querySelectorAll('.roomBox').forEach(box=>{ const id=box.id.replace('room',''); const rname=document.getElementById('rname'+id)?.value; const rprice=document.getElementById('rprice'+id)?.value; const rav=document.getElementById('ravailable'+id)?.value; const rd=document.getElementById('rdesc'+id)?.value; if(rname&&rprice) rooms.push({type:rname, price:rprice, available:rav||'1', desc:rd||''}); }); if(rooms.length==0){alert('Add at least one room category');return;} document.getElementById('status').innerText='Uploading...'; push(ref(db,'hotels'),{name,location:loc,phone:whatsapp,whatsapp,desc,image:base64Image,rooms,createdAt:Date.now()}).then(()=>{document.getElementById('status').innerText='✅ Uploaded!'; document.getElementById('name').value=''; document.getElementById('rooms').innerHTML=''; roomCount=0; addRoom();}); };
onValue(ref(db,'hotels'),snap=>{ const data=snap.val(); const list=document.getElementById('list'); list.innerHTML=''; if(!data)return; Object.entries(data).reverse().forEach(([k,h])=>{ list.innerHTML+=`<div style="background:white;padding:10px;margin:10px 0;border-radius:8px"><img src="${h.image}"><b>${h.name}</b> - ${h.location}<br>WhatsApp: ${h.phone}<br>Rooms: ${(h.rooms||[]).length} categories<br><button onclick="deleteHotel('${k}')" style="background:black">Delete Hotel</button></div>`; }); });
window.deleteHotel=(k)=>{ if(confirm('Delete?')) remove(ref(db,'hotels/'+k)); };
</script>
</body>
</html>
