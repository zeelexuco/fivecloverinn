<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin V4 - Search Ready</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{background:#f1f5f9;margin:0;padding:16px}.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}input,select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0}button{background:#0f172a;color:#fff;font-weight:700;cursor:pointer}button.green{background:#16a34a}button.red{background:#dc2626;width:auto;padding:6px 12px}button.orange{background:#f59e0b}</style>
</head><body>
<div id="loginBox" class="card" style="max-width:380px;margin:70px auto">
<h3>Admin Login</h3><input type="password" id="pwd" placeholder="Password"><button onclick="doLogin()">Login</button>
</div>

<div id="adminBox" style="display:none;max-width:1000px;margin:0 auto">
<h2>☘️ FiveClover Admin V4 (Search Ready)</h2>
<button class="orange" onclick="clearDemo()">⚠️ 1. Click here to DELETE Demo hotel first</button>

<div class="card"><h3>2. Add Hotel</h3>
<input id="hotelName" placeholder="Hotel Name e.g Caritas INN YABA">
<input id="hotelLoc" placeholder="Location e.g YABA, LEKKI, IGBOBI - Customer go search with this">
<input id="hotelWhatsApp" placeholder="WhatsApp e.g 2349122649648 (no +)">
<input id="hotelPic" type="file" accept="image/*">
<button class="green" onclick="addHotel()">Add Hotel</button>
</div>

<div class="card"><h3>3. Add Room To Hotel (Important!)</h3>
<select id="hotelSelect"><option value="">-- Select Hotel First --</option></select>
<input id="roomType" placeholder="Room Type e.g STANDARD">
<input id="roomPrice" placeholder="Price e.g 43900">
<input id="roomTotal" placeholder="Total Rooms e.g 10">
<input id="roomPic" type="file" accept="image/*">
<button class="green" onclick="addRoom()">Add Room</button>
</div>

<div class="card"><h3>Hotels Live - This is what customer will search</h3><div id="hotelsList"></div></div>
<div class="card"><a href="./"><button>✅ View Customer Search Site</button></a></div>
</div>

<script>
const PWD='clover2025';
function doLogin(){if(document.getElementById('pwd').value===PWD){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';load();}else alert('Wrong password');}
function getHotels(){let d=localStorage.getItem('fiveclover_hotels'); if(!d) return []; try{return JSON.parse(d)}catch(e){return []}}
function saveHotels(h){localStorage.setItem('fiveclover_hotels',JSON.stringify(h))}
function fileToBase64(f){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
async function addHotel(){
 let n=document.getElementById('hotelName').value.trim(); let l=document.getElementById('hotelLoc').value.trim(); let w=document.getElementById('hotelWhatsApp').value.trim().replace(/[^0-9]/g,''); let file=document.getElementById('hotelPic').files[0];
 if(!n||!l) return alert('Name + Location needed - Location na wetin customer go search');
 let pic=''; if(file) pic=await fileToBase64(file);
 let hs=getHotels(); hs=hs.filter(h=>!h.name.toLowerCase().includes('demo'));
 hs.push({id:'h'+Date.now(),name:n,location:l,whatsapp:w,image:pic,rooms:[]});
 saveHotels(hs); document.getElementById('hotelName').value='';document.getElementById('hotelLoc').value='';document.getElementById('hotelWhatsApp').value='';document.getElementById('hotelPic').value=''; load();
 alert('Hotel added! Now go to step 3 - Select it and add rooms');
}
async function addRoom(){
 let hid=document.getElementById('hotelSelect').value; let t=document.getElementById('roomType').value.trim(); let p=parseInt((document.getElementById('roomPrice').value||'').replace(/[^0-9]/g,'')); let tot=parseInt((document.getElementById('roomTotal').value||'').replace(/[^0-9]/g,'')); let file=document.getElementById('roomPic').files[0];
 if(!hid||!t||!p||!tot) return alert('Select hotel + Fill all fields');
 let pic=''; if(file) pic=await fileToBase64(file);
 let hs=getHotels(); let h=hs.find(x=>x.id===hid); if(!h) return alert('Hotel not found');
 h.rooms.push({id:'r'+Date.now(),type:t,price:p,total:tot,image:pic});
 saveHotels(hs); document.getElementById('roomType').value='';document.getElementById('roomPrice').value='';document.getElementById('roomTotal').value='';document.getElementById('roomPic').value=''; load();
}
function deleteHotel(id){if(!confirm('Delete?'))return; saveHotels(getHotels().filter(x=>x.id!==id)); load();}
function clearDemo(){saveHotels(getHotels().filter(h=>!h.name.toLowerCase().includes('demo'))); load(); alert('Demo deleted! Now your Caritas hotels go show for customer search');}
function load(){
 let hs=getHotels(); let sel=document.getElementById('hotelSelect'); sel.innerHTML='<option value="">-- Select Hotel First --</option>'; hs.forEach(h=>{let o=document.createElement('option');o.value=h.id;o.textContent=h.name+' - '+h.location+' ('+h.rooms.length+' rooms)';sel.appendChild(o)});
 document.getElementById('hotelsList').innerHTML=hs.map(h=>`<div style="border:1px solid #eee;padding:10px;margin-bottom:8px;border-radius:8px"><b>${h.name}</b> - ${h.location}<br><small>WhatsApp: ${h.whatsapp||'not set'} | ${h.rooms.length} rooms</small> <button class="red" onclick="deleteHotel('${h.id}')">Delete</button><ul>${h.rooms.map(r=>`<li>${r.type} - ₦${r.price.toLocaleString()} (${r.total} units)</li>`).join('')||'<li style="color:red">No rooms yet! Add room for this hotel in Step 3</li>'}</ul></div>`).join('')||'No hotels yet';
}
</script>
</body></html>
