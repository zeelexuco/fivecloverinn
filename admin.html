<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiveClover Inn - Full Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-100 p-3">
<div class="max-w-2xl mx-auto">
<div class="bg-white rounded-2xl p-5 shadow mb-5">
<h1 class="text-2xl font-bold mb-4">1. Add New Hotel</h1>
<input id="hotelName" placeholder="Hotel Name" class="w-full border-2 rounded-xl p-3 mb-3">
<input id="hotelAddress" placeholder="Full Address" class="w-full border-2 rounded-xl p-3 mb-3">
<input id="hotelWhatsApp" placeholder="WhatsApp" class="w-full border-2 rounded-xl p-3 mb-3">
<div class="border-2 border-dashed rounded-xl p-3 mb-3 flex gap-3">
<label class="bg-blue-100 text-blue-700 px-4 py-2 rounded-full text-sm font-bold cursor-pointer">Choose File<input type="file" id="hotelImage" hidden accept="image/*"></label>
<span id="hotelFileName" class="text-sm">no file selected</span>
</div>
<button id="saveHotelBtn" class="w-full bg-green-600 text-white rounded-xl p-3 font-bold">Save Hotel</button>
<p id="hotelStatus" class="text-sm mt-2 font-bold"></p>
</div>
<div class="bg-white rounded-2xl p-5 shadow mb-5">
<h2 class="text-xl font-bold">Hotels Live - <span id="hotelCount">0</span></h2>
<div id="hotelsList" class="mt-4"></div>
</div>
<div class="bg-white rounded-2xl p-5 shadow">
<h2 class="text-xl font-bold mb-2">📋 Bookings (Confirm & auto return 12PM)</h2>
<div id="bookingsList" class="space-y-3"></div>
</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDzVRHwXgZXZmlX7KIehTLb1n-ZjGJwWfI",
  authDomain: "fiveclover-237bb.firebaseapp.com",
  databaseURL: "https://fiveclover-237bb-default-rtdb.firebaseio.com",
  projectId: "fiveclover-237bb",
  storageBucket: "fiveclover-237bb.firebasestorage.app",
  messagingSenderId: "337287455721",
  appId: "1:337287455721:web:ebbb8fd23959b1b0922178",
  measurementId: "G-G2EG4G3YLZ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();
document.getElementById('hotelImage').addEventListener('change', e=>{document.getElementById('hotelFileName').textContent = e.target.files[0]?.name || 'no file selected';});
async function uploadImage(file, path){const ref = storage.ref().child(path + '/' + Date.now() + '_' + file.name); await ref.put(file); return await ref.getDownloadURL();}
document.getElementById('saveHotelBtn').onclick = async ()=>{
  const name = document.getElementById('hotelName').value.trim();
  const address = document.getElementById('hotelAddress').value.trim();
  const whatsapp = document.getElementById('hotelWhatsApp').value.trim();
  const file = document.getElementById('hotelImage').files[0];
  const status = document.getElementById('hotelStatus');
  if(!name ||!address){alert('Fill name and address'); return;}
  status.textContent = 'Saving...'; try{let imageUrl=''; if(file) imageUrl = await uploadImage(file,'hotels'); await db.collection('hotels').add({name,address,whatsapp,imageUrl,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); status.textContent='Hotel saved! ✅';}catch(err){status.textContent='Error: '+err.message;}};
db.collection('hotels').orderBy('createdAt','desc').onSnapshot(snap=>{document.getElementById('hotelCount').textContent=snap.size; const container=document.getElementById('hotelsList'); container.innerHTML=''; snap.forEach(doc=>{const hotel=doc.data(); const id=doc.id; const div=document.createElement('div'); div.className='border-2 rounded-2xl p-4 mb-4 bg-gray-50'; div.innerHTML=`<div class="font-bold text-sm">${hotel.name} - ${hotel.address}<br>WhatsApp: ${hotel.whatsapp} <button onclick="deleteHotel('${id}')" class="bg-red-500 text-white px-3 py-1 rounded-full text-xs ml-2">Delete</button></div>${hotel.imageUrl? `<img src="${hotel.imageUrl}" class="w-full h-32 object-cover rounded-xl mt-2">`:''}<div id="rooms-${id}" class="mt-3"></div><div class="bg-white p-3 rounded-xl mt-3 border-2"><p class="font-bold text-sm mb-2">Add Room Type (with Pic & Total)</p><div class="grid grid-cols-2 gap-2 mb-2"><input id="roomType-${id}" placeholder="STANDARD" class="border rounded-xl p-2 text-sm"><input id="roomPrice-${id}" type="number" placeholder="Price 43900" class="border rounded-xl p-2 text-sm"></div><div class="grid grid-cols-2 gap-2 mb-2"><input id="roomTotal-${id}" type="number" placeholder="Total Rooms 10" class="border rounded-xl p-2 text-sm bg-yellow-50"><label class="border rounded-xl p-2 text-sm bg-blue-50 cursor-pointer text-center">📷 Room Pic<input type="file" id="roomImage-${id}" hidden accept="image/*"><span id="roomFile-${id}" class="text-[10px] block">no file</span></label></div><button onclick="addRoom('${id}')" class="w-full bg-slate-800 text-white rounded-xl p-2 text-sm font-bold">Add Room</button></div>`; container.appendChild(div); setTimeout(()=>{const inp=document.getElementById(`roomImage-${id}`); if(inp) inp.addEventListener('change', e=>{document.getElementById(`roomFile-${id}`).textContent=e.target.files[0]?.name||'no file';});},100); listenRooms(id);});});
function deleteHotel(id){if(confirm('Delete hotel?')) db.collection('hotels').doc(id).delete();}
async function addRoom(hotelId){const type=document.getElementById(`roomType-${hotelId}`).value.trim(); const price=parseInt(document.getElementById(`roomPrice-${hotelId}`).value); const total=parseInt(document.getElementById(`roomTotal-${hotelId}`).value); const file=document.getElementById(`roomImage-${hotelId}`).files[0]; if(!type||!price||!total){alert('Fill type, price, total'); return;} try{let imageUrl=''; if(file) imageUrl=await uploadImage(file,`rooms/${hotelId}`); await db.collection('hotels').doc(hotelId).collection('rooms').add({type,price,totalRooms:total,bookedRooms:0,availableRooms:total,imageUrl,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){alert(e.message);}}
function listenRooms(hotelId){db.collection('hotels').doc(hotelId).collection('rooms').onSnapshot(snap=>{const cont=document.getElementById(`rooms-${hotelId}`); if(!cont) return; cont.innerHTML=''; snap.forEach(rDoc=>{const r=rDoc.data(); const available=(r.totalRooms||0)-(r.bookedRooms||0); const isFull=available<=0; const el=document.createElement('div'); el.className=`flex items-center justify-between border-2 rounded-xl p-2 mt-2 ${isFull?'bg-red-50 border-red-300':'bg-white'}`; el.innerHTML=`<div class="flex items-center gap-2">${r.imageUrl?`<img src="${r.imageUrl}" class="w-14 h-14 rounded-lg object-cover">`:''}<div class="text-xs"><div class="font-bold">${r.type} - ₦${r.price} ${isFull?'<span class="text-red-600">[FULL]</span>':''}</div><div>Total: ${r.totalRooms} | Booked: ${r.bookedRooms||0} | <b>Available: ${available}</b></div></div></div><button onclick="deleteRoom('${hotelId}','${rDoc.id}')" class="text-red-500 text-xs">✕</button>`; cont.appendChild(el);});});}
function deleteRoom(hId,rId){if(confirm('Delete room?')) db.collection('hotels').doc(hId).collection('rooms').doc(rId).delete();}
db.collection('bookings').orderBy('createdAt','desc').limit(50).onSnapshot(snap=>{const list=document.getElementById('bookingsList'); list.innerHTML=snap.empty?'<p class="text-sm text-gray-400">No bookings yet</p>':''; snap.forEach(doc=>{const b=doc.data(); const checkoutTime=b.checkoutAt?.toDate?b.checkoutAt.toDate():null; const now=new Date(); if(b.status==='confirmed'&&checkoutTime&&now>checkoutTime){autoReturnRoom(b); db.collection('bookings').doc(doc.id).update({status:'completed'});} const div=document.createElement('div'); div.className='border rounded-xl p-3 text-sm bg-gray-50'; div.innerHTML=`<div><b>${b.hotelName||'Hotel'} - ${b.roomType||'Room'}</b> | Guest: ${b.guestName||b.name||'N/A'} | ${b.status||'pending'}</div><div class="text-xs text-gray-500">Return: 12PM next day</div><div class="mt-2 flex gap-2">${b.status!=='confirmed'&&b.status!=='completed'?`<button onclick="confirmBooking('${doc.id}')" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs">Confirm (Reduce Room)</button>`:'<span class="text-green-600 text-xs">✅ Confirmed</span>'}<button onclick="cancelBooking('${doc.id}')" class="bg-gray-200 px-3 py-1 rounded-full text-xs">Cancel/Return</button></div>`; list.appendChild(div);});});
async function confirmBooking(bookingId){const bDoc=await db.collection('bookings').doc(bookingId).get(); const b=bDoc.data(); const hotelsSnap=await db.collection('hotels').where('name','==',b.hotelName).get(); if(hotelsSnap.empty){alert('Hotel not found'); return;} const hotelId=hotelsSnap.docs[0].id; const roomsSnap=await db.collection('hotels').doc(hotelId).collection('rooms').where('type','==',b.roomType).get(); if(roomsSnap.empty){alert('Room type not found'); return;} const roomRef=roomsSnap.docs[0].ref; if((roomsSnap.docs[0].data().availableRooms||0)<=0){alert('No available rooms!'); return;} const checkoutAt=new Date(); checkoutAt.setDate(checkoutAt.getDate()+1); checkoutAt.setHours(12,0,0,0); await roomRef.update({bookedRooms:firebase.firestore.FieldValue.increment(1),availableRooms:firebase.firestore.FieldValue.increment(-1)}); await db.collection('bookings').doc(bookingId).update({status:'confirmed',checkoutAt:firebase.firestore.Timestamp.fromDate(checkoutAt),confirmedAt:firebase.firestore.FieldValue.serverTimestamp()}); alert('✅ Confirmed! Room reduced. Will auto return by 12PM tomorrow.');}
async function cancelBooking(bookingId){const bDoc=await db.collection('bookings').doc(bookingId).get(); const b=bDoc.data(); if(b.status==='confirmed'){await autoReturnRoom(b);} await db.collection('bookings').doc(bookingId).update({status:'cancelled'});}
async function autoReturnRoom(booking){try{const hotelsSnap=await db.collection('hotels').where('name','==',booking.hotelName).get(); if(hotelsSnap.empty) return; const hotelId=hotelsSnap.docs[0].id; const roomsSnap=await db.collection('hotels').doc(hotelId).collection('rooms').where('type','==',booking.roomType).get(); if(roomsSnap.empty) return; await roomsSnap.docs[0].ref.update({bookedRooms:firebase.firestore.FieldValue.increment(-1),availableRooms:firebase.firestore.FieldValue.increment(1)});}catch(e){console.log(e);}}
</script>
</body>
</html>
