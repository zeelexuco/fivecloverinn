<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Cloud V5</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{background:#f1f5f9;margin:0;padding:16px}.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px}input,select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0}button{background:#0f172a;color:#fff;font-weight:700}button.green{background:#16a34a}button.red{background:#dc2626;width:auto}</style>
</head><body>
<div id="loginBox" class="card" style="max-width:380px;margin:70px auto"><h3>Admin Login</h3><input type="password" id="pwd" placeholder="Password"><button onclick="login()">Login</button></div>
<div id="adminBox" style="display:none;max-width:1000px;margin:0 auto">
<h2>☘️ Admin CLOUD V5 - Live for all customers</h2>
<div class="card"><h3>Add Hotel</h3><input id="hName" placeholder="Hotel Name"><input id="hLoc" placeholder="Location e.g YABA"><input id="hW" placeholder="WhatsApp 234..."><input id="hPic" type="file" accept="image/*"><button class="green" onclick="addHotel()">Add Hotel to CLOUD</button></div>
<div class="card"><h3>Add Room</h3><select id="hSelect"><option value="">Select Hotel</option></select><input id="rType" placeholder="Room Type"><input id="rPrice" placeholder="Price"><input id="rTotal" placeholder="Total Rooms"><input id="rPic" type="file" accept="image/*"><button class="green" onclick="addRoom()">Add Room to CLOUD</button></div>
<div class="card"><h3>Live Hotels (Cloud)</h3><div id="list"></div></div>
<div class="card"><a href="./"><button>View Customer Site</button></a></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, arrayUnion, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDzVRHwXgZXZmlX7KIehTLb1n-ZjGJwWfI",
  authDomain: "fiveclover-237bb.firebaseapp.com",
  projectId: "fiveclover-237bb",
  storageBucket: "fiveclover-237bb.firebasestorage.app",
  messagingSenderId: "337287455721",
  appId: "1:337287455721:web:ebbb8fd23959b1b0922178",
  measurementId: "G-G2EG4G3YLZ"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.login=()=>{if(document.getElementById('pwd').value==='clover2025'){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';load();}else alert('Wrong');}
function toBase64(f){return new Promise(res=>{if(!f) return res(''); let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);})}
window.addHotel=async()=>{
  let n=document.getElementById('hName').value.trim(), l=document.getElementById('hLoc').value.trim(), w=document.getElementById('hW').value.trim().replace(/[^0-9]/g,''), file=document.getElementById('hPic').files[0];
  if(!n||!l) return alert('Name + Location needed');
  let pic=await toBase64(file);
  await addDoc(collection(db,"hotels"),{name:n,location:l.toUpperCase(),whatsapp:w,image:pic,rooms:[]});
  document.getElementById('hName').value='';document.getElementById('hLoc').value='';document.getElementById('hW').value='';document.getElementById('hPic').value='';
  alert('Hotel added to CLOUD! All customers go see am now');
}
window.addRoom=async()=>{
  let hid=document.getElementById('hSelect').value, t=document.getElementById('rType').value, p=parseInt(document.getElementById('rPrice').value.replace(/[^0-9]/g,'')), tot=parseInt(document.getElementById('rTotal').value.replace(/[^0-9]/g,'')), file=document.getElementById('rPic').files[0];
  if(!hid||!t||!p||!tot) return alert('Fill all');
  let pic=await toBase64(file);
  let ref=doc(db,"hotels",hid);
  // get current rooms
  let hotelsSnap=await getDocs(collection(db,"hotels")); let cur=[]; hotelsSnap.forEach(d=>{if(d.id===hid) cur=d.data().rooms||[]});
  cur.push({id:'r'+Date.now(),type:t,price:p,total:tot,image:pic});
  await updateDoc(ref,{rooms:cur});
  document.getElementById('rType').value='';document.getElementById('rPrice').value='';document.getElementById('rTotal').value='';document.getElementById('rPic').value='';
  alert('Room added to cloud');
}
function load(){
  onSnapshot(collection(db,"hotels"),snap=>{
    let hotels=[]; snap.forEach(d=>hotels.push({id:d.id,...d.data()}));
    let sel=document.getElementById('hSelect'); sel.innerHTML='<option value="">Select Hotel</option>'; hotels.forEach(h=>{let o=document.createElement('option');o.value=h.id;o.textContent=h.name+' - '+h.location;sel.appendChild(o);});
    document.getElementById('list').innerHTML=hotels.map(h=>`<div style="border:1px solid #eee;padding:8px;margin-bottom:6px;border-radius:8px"><b>${h.name}</b> - ${h.location} (${h.rooms.length} rooms) <button class="red" onclick="delH('${h.id}')">Delete</button><ul>${h.rooms.map(r=>`<li>${r.type} ₦${r.price}</li>`).join('')}</ul></div>`).join('')||'No hotels yet - Add your 3 Caritas hotels now';
  });
}
window.delH=async(id)=>{if(confirm('Delete?')) await deleteDoc(doc(db,"hotels",id));}
</script>
</body></html>
